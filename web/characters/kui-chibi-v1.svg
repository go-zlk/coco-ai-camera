<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-labelledby="title desc">
<title id="title">Kui 的 Q 版角色</title><desc id="desc">根据注册照片绘制的毛绒猫咪插画，非真实照片。</desc>
<defs>
 <linearGradient id="coat" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#f3d6b5"/><stop offset=".65" stop-color="#e5b993"/><stop offset="1" stop-color="#bd8862"/></linearGradient>
 <radialGradient id="white" cx=".42" cy=".22" r=".85"><stop stop-color="#fffef9"/><stop offset=".7" stop-color="#f6f1e9"/><stop offset="1" stop-color="#e2ddd6"/></radialGradient>
 <radialGradient id="face" cx=".46" cy=".34" r=".73"><stop stop-color="#fffefb"/><stop offset=".76" stop-color="#faf5ef"/><stop offset="1" stop-color="#e8e2dc"/></radialGradient>
