 <radialGradient id="eye"><stop stop-color="#9d795b"/><stop offset=".72" stop-color="#484249"/><stop offset="1" stop-color="#302e38"/></radialGradient>
 <radialGradient id="cheek"><stop stop-color="#eec7bf" stop-opacity=".65"/><stop offset="1" stop-color="#eec7bf" stop-opacity="0"/></radialGradient>
</defs>
